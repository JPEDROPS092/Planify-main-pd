  /api/users/auth/login/:
    post:
      operationId: users_auth_login_create
      description: "\n    Realiza o login do usuário e retorna os tokens de acesso\
        \ e refresh.\n    \n    O token de acesso deve ser usado no header de todas\
        \ as requisições:\n    `Authorization: Bearer <access_token>` ou `Authorization:\
        \ JWT <access_token>`\n    \n    Quando o token de acesso expirar (após 1\
        \ hora), use o token de refresh para obter um novo.\n    "
      summary: Login de usuário
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - JWT Authentication: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: Credenciais inválidas
  /api/users/auth/logout/:
    post:
      operationId: users_auth_logout_create
      description: "\n    Realiza o logout do usuário invalidando os tokens de acesso\
        \ e refresh.\n    \n    O token fornecido será adicionado à blacklist para\
        \ garantir que não possa ser usado novamente.\n    "
      summary: Logout de usuário
      tags:
