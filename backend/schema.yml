components:
  schemas:
    AccessProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - permissions
      - updated_at
    AccessProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - name
    ActionEnum:
      enum:
      - VIEW
      - CREATE
      - EDIT
      - DELETE
      - APPROVE
      - ASSIGN
      - EXPORT
      - IMPORT
      - COMMENT
      type: string
      description: |-
        * `VIEW` - View
        * `CREATE` - Create
        * `EDIT` - Edit
        * `DELETE` - Delete
        * `APPROVE` - Approve
        * `ASSIGN` - Assign
        * `EXPORT` - Export
        * `IMPORT` - Import
        * `COMMENT` - Comment
    Alerta:
      type: object
      description: |-
        Serializer para o modelo Alerta.

        Inclui todos os campos do modelo Alerta.
        Adiciona campos de leitura para exibir o valor textual dos campos de escolha
        ('tipo', 'status') e nomes relacionados (projeto, tarefa, resolvedor).
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          $ref: '#/components/schemas/AlertaTipoEnum'
        tipo_display:
          type: string
          readOnly: true
        projeto:
          type: integer
        projeto_nome:
          type: string
          readOnly: true
        tarefa:
          type: integer
          nullable: true
        tarefa_titulo:
          type: string
          readOnly: true
        percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        mensagem:
          type: string
        status:
          $ref: '#/components/schemas/AlertaStatusEnum'
        status_display:
          type: string
          readOnly: true
        data_criacao:
          type: string
          format: date-time
          readOnly: true
        data_resolucao:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolvido_por:
          type: integer
          nullable: true
        resolvido_por_nome:
          type: string
          readOnly: true
      required:
      - data_criacao
      - data_resolucao
      - id
      - mensagem
      - percentual
      - projeto
      - projeto_nome
      - resolvido_por_nome
      - status_display
      - tarefa_titulo
      - tipo
      - tipo_display
    AlertaRequest:
      type: object
      description: |-
        Serializer para o modelo Alerta.

        Inclui todos os campos do modelo Alerta.
        Adiciona campos de leitura para exibir o valor textual dos campos de escolha
        ('tipo', 'status') e nomes relacionados (projeto, tarefa, resolvedor).
      properties:
        tipo:
          $ref: '#/components/schemas/AlertaTipoEnum'
        projeto:
          type: integer
        tarefa:
          type: integer
          nullable: true
        percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        mensagem:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/AlertaStatusEnum'
        resolvido_por:
          type: integer
          nullable: true
      required:
      - mensagem
      - percentual
      - projeto
      - tipo
    AlertaStatusEnum:
      enum:
      - ATIVO
      - RESOLVIDO
      - IGNORADO
      type: string
      description: |-
        * `ATIVO` - Ativo
        * `RESOLVIDO` - Resolvido
        * `IGNORADO` - Ignorado
    AlertaTipoEnum:
      enum:
      - PROJETO
      - TAREFA
      type: string
      description: |-
        * `PROJETO` - Projeto
        * `TAREFA` - Tarefa
    AtribuicaoTarefa:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tarefa:
          type: integer
        usuario:
          type: integer
        usuario_nome:
          type: string
          readOnly: true
        atribuido_em:
          type: string
          format: date-time
          readOnly: true
        atribuido_por:
          type: integer
          nullable: true
        atribuido_por_nome:
          type: string
          readOnly: true
      required:
      - atribuido_em
