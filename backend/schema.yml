      summary: Obter detalhes da mensagem
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Mensagem de Chat.
        required: true
      tags:
      - Comunicação
      security:
      - JWT Authentication: []
