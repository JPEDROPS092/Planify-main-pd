          readOnly: true
        descricao:
          type: string
          maxLength: 200
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tipo:
          $ref: '#/components/schemas/CustoTipoEnum'
        tipo_display:
          type: string
          readOnly: true
        data:
          type: string
          format: date
        comprovante:
          type: string
          format: uri
          nullable: true
        observacoes:
          type: string
          nullable: true
        criado_por:
          type: integer
          nullable: true
