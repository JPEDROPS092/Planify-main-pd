  /api/users/auth/register/:
    post:
      operationId: users_auth_register_create
      description: "\n    Permite o registro público de novos usuários no sistema.\n\
        \    \n    - Qualquer pessoa pode criar uma conta sem necessidade de autenticação\
        \ prévia\n    - O papel padrão atribuído é TEAM_MEMBER se não especificado\n\
