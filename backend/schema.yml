    PatchedNotificacaoRequest:
      type: object
      description: |-
        Serializer para notificações com suporte ao GenericForeignKey.

        Inclui campos para exibir informações sobre o objeto relacionado
        através do GenericForeignKey de forma amigável.
      properties:
        usuario:
          type: integer
          description: Usuário que receberá a notificação
        tipo:
          allOf:
          - $ref: '#/components/schemas/NotificacaoTipoEnum'
          description: |-
            Tipo de objeto relacionado à notificação

            * `TAREFA` - Tarefa
            * `PROJETO` - Projeto
            * `EQUIPE` - Equipe
            * `RISCO` - Risco
            * `DOCUMENTO` - Documento
            * `SISTEMA` - Sistema
            * `CHAT` - Chat
        titulo:
          type: string
          minLength: 1
          description: Título breve da notificação
          maxLength: 200
        mensagem:
          type: string
          minLength: 1
          description: Conteúdo detalhado da notificação
        lida:
          type: boolean
          description: Indica se a notificação foi lida pelo usuário
        prioridade:
          allOf:
          - $ref: '#/components/schemas/PrioridadeEnum'
          description: |-
            Nível de prioridade da notificação

            * `BAIXA` - Baixa
            * `MEDIA` - Média
            * `ALTA` - Alta
        projeto:
          type: integer
          nullable: true
          description: Projeto relacionado à notificação (se aplicável) - DEPRECATED
        tarefa:
          type: integer
          nullable: true
          description: Tarefa relacionada à notificação (se aplicável) - DEPRECATED
        url:
          type: string
          nullable: true
          description: URL para redirecionamento quando a notificação for clicada
          maxLength: 255
        content_type:
          type: integer
          nullable: true
          description: 'O tipo do objeto relacionado (ex: Projeto, Tarefa, Risco).'
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: O ID do objeto relacionado.
