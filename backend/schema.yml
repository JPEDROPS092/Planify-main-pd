      description: |-
        Serializer para o modelo Comunicacao.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Inclui campos calculados para exibir informações relacionadas de forma mais amigável.
      properties:
        id:
          type: integer
          readOnly: true
        projeto:
          type: integer
          description: Projeto ao qual esta comunicação está associada
        projeto_nome:
          type: string
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/ComunicacaoTipoEnum'
          description: |-
            Tipo de comunicação formal

            * `ATA` - Ata de Reunião
            * `MEMORANDO` - Memorando
            * `RELATORIO` - Relatório
            * `OFICIO` - Ofício
            * `COMUNICADO` - Comunicado Geral
            * `OUTRO` - Outro
        tipo_display:
          type: string
          readOnly: true
        titulo:
          type: string
          description: Título ou assunto da comunicação
          maxLength: 200
        texto:
          type: string
          description: Conteúdo detalhado da comunicação
        remetente:
          type: integer
          readOnly: true
          description: Usuário que enviou a comunicação
        remetente_nome:
          type: string
          readOnly: true
        remetente_username:
          type: string
          readOnly: true
        destinatarios:
          type: array
          items:
            type: integer
          description: Usuários que receberam esta comunicação
        destinatarios_info:
          type: array
          items:
            $ref: '#/components/schemas/DestinatarioInfo'
          readOnly: true
        criada_em:
          type: string
          format: date-time
          readOnly: true
          description: Data e hora em que a comunicação foi criada
        atualizada_em:
          type: string
          format: date-time
          readOnly: true
          description: Data e hora da última atualização da comunicação
      required:
      - atualizada_em
      - criada_em
      - destinatarios
      - destinatarios_info
      - id
      - projeto
      - projeto_nome
      - remetente
      - remetente_nome
      - remetente_username
      - texto
      - tipo_display
      - titulo
    ComunicacaoRequest:
      type: object
      description: |-
        Serializer para o modelo Comunicacao.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Inclui campos calculados para exibir informações relacionadas de forma mais amigável.
      properties:
        projeto:
          type: integer
          description: Projeto ao qual esta comunicação está associada
        tipo:
          allOf:
          - $ref: '#/components/schemas/ComunicacaoTipoEnum'
          description: |-
            Tipo de comunicação formal

            * `ATA` - Ata de Reunião
            * `MEMORANDO` - Memorando
            * `RELATORIO` - Relatório
            * `OFICIO` - Ofício
            * `COMUNICADO` - Comunicado Geral
            * `OUTRO` - Outro
        titulo:
          type: string
          minLength: 1
          description: Título ou assunto da comunicação
          maxLength: 200
        texto:
          type: string
          minLength: 1
          description: Conteúdo detalhado da comunicação
        destinatarios:
          type: array
          items:
            type: integer
          description: Usuários que receberam esta comunicação
