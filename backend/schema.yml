    PatchedComunicacaoRequest:
      type: object
      description: |-
        Serializer para o modelo Comunicacao.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Inclui campos calculados para exibir informações relacionadas de forma mais amigável.
      properties:
        projeto:
          type: integer
          description: Projeto ao qual esta comunicação está associada
        tipo:
          allOf:
          - $ref: '#/components/schemas/ComunicacaoTipoEnum'
          description: |-
            Tipo de comunicação formal

            * `ATA` - Ata de Reunião
            * `MEMORANDO` - Memorando
            * `RELATORIO` - Relatório
            * `OFICIO` - Ofício
            * `COMUNICADO` - Comunicado Geral
            * `OUTRO` - Outro
        titulo:
          type: string
          minLength: 1
          description: Título ou assunto da comunicação
          maxLength: 200
        texto:
          type: string
          minLength: 1
          description: Conteúdo detalhado da comunicação
        destinatarios:
          type: array
          items:
            type: integer
          description: Usuários que receberam esta comunicação
    PatchedConfiguracaoNotificacaoRequest:
      type: object
      description: |-
        Serializer simplificado para configurações de notificação.

        A lógica de get_or_create foi movida para a view, tornando este
        serializer mais simples e focado apenas na serialização/deserialização.
      properties:
        tarefa_atribuida:
          allOf:
          - $ref: '#/components/schemas/TarefaAtribuidaEnum'
          description: |-
            Canal de notificação quando uma tarefa é atribuída ao usuário

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        tarefa_comentario:
          allOf:
          - $ref: '#/components/schemas/TarefaComentarioEnum'
          description: |-
            Canal de notificação quando há um novo comentário em uma tarefa do usuário

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        tarefa_prazo:
          allOf:
          - $ref: '#/components/schemas/TarefaPrazoEnum'
          description: |-
            Canal de notificação para lembretes de prazo de tarefas

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        projeto_status:
          allOf:
          - $ref: '#/components/schemas/ProjetoStatusEnum'
          description: |-
            Canal de notificação quando o status de um projeto é alterado

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        equipe_alteracao:
          allOf:
          - $ref: '#/components/schemas/EquipeAlteracaoEnum'
          description: |-
            Canal de notificação quando há alterações na equipe de um projeto

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        documento_novo:
          allOf:
          - $ref: '#/components/schemas/DocumentoNovoEnum'
          description: |-
            Canal de notificação quando um novo documento é adicionado

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        risco_novo:
          allOf:
          - $ref: '#/components/schemas/RiscoNovoEnum'
          description: |-
            Canal de notificação quando um novo risco é registrado

            * `EMAIL` - E-mail
            * `SISTEMA` - Sistema
            * `AMBOS` - Ambos
            * `NENHUM` - Nenhum
        mensagem_chat:
          allOf:
          - $ref: '#/components/schemas/MensagemChatEnum'
