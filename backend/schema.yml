  /api/communications/notificacoes/:
    get:
      operationId: communications_notificacoes_list
      description: Retorna uma lista paginada de notificações.
      summary: Listar notificações
      parameters:
      - in: query
        name: content_type
        schema:
          type: integer
      - in: query
        name: content_type_model
        schema:
          type: string
        description: 'Filtrar por tipo de objeto relacionado (ex: projeto, tarefa)'
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: 'Data de fim para filtrar notificações (formato: YYYY-MM-DD)'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: 'Data de início para filtrar notificações (formato: YYYY-MM-DD)'
      - in: query
        name: lida
        schema:
          type: boolean
      - in: query
        name: object_id
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: prioridade
        schema:
          type: string
          enum:
          - ALTA
          - BAIXA
          - MEDIA
        description: |-
          Nível de prioridade da notificação

          * `BAIXA` - Baixa
          * `MEDIA` - Média
          * `ALTA` - Alta
      - in: query
        name: projeto
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tarefa
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - CHAT
          - DOCUMENTO
          - EQUIPE
          - PROJETO
          - RISCO
          - SISTEMA
          - TAREFA
        description: |-
          Tipo de objeto relacionado à notificação

          * `TAREFA` - Tarefa
          * `PROJETO` - Projeto
          * `EQUIPE` - Equipe
          * `RISCO` - Risco
          * `DOCUMENTO` - Documento
          * `SISTEMA` - Sistema
          * `CHAT` - Chat
      - in: query
        name: titulo
        schema:
          type: string
        description: Texto contido no título da notificação (busca case-insensitive)
      tags:
      - Comunicação
      security:
      - JWT Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificacaoList'
          description: ''
    post:
      operationId: communications_notificacoes_create
      description: Cria um nova notificação.
      summary: Criar nova notificação
      tags:
      - Comunicação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificacaoRequest'
        required: true
      security:
      - JWT Authentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacao'
          description: ''
  /api/communications/notificacoes/{id}/:
    get:
      operationId: communications_notificacoes_retrieve
      description: Retorna informações detalhadas de uma notificação específica.
      summary: Obter detalhes da notificação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Notificação.
        required: true
      tags:
      - Comunicação
      security:
      - JWT Authentication: []
      responses:
        '200':
