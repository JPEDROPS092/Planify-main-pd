openapi: 3.0.3
info:
  title: Planify API
  version: 1.0.0
  description: Sistema de Gerenciamento de Projetos
paths:
  /api/communications/:
    get:
      operationId: communications_list
      description: |-
        ViewSet para gerenciamento de comunicações formais.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Comunicações formais são documentos oficiais como atas, memorandos e relatórios.

        Endpoints:
        - GET /comunicacoes/ - Lista todas as comunicações (com filtros)
        - POST /comunicacoes/ - Cria uma nova comunicação
        - GET /comunicacoes/{id}/ - Obtém detalhes de uma comunicação
        - PUT/PATCH /comunicacoes/{id}/ - Atualiza uma comunicação
        - DELETE /comunicacoes/{id}/ - Remove uma comunicação
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: 'Data de fim para filtrar comunicações (formato: YYYY-MM-DD)'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: 'Data de início para filtrar comunicações (formato: YYYY-MM-DD)'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: projeto
        schema:
          type: integer
      - in: query
        name: remetente
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: texto
        schema:
          type: string
        description: Texto contido no conteúdo da comunicação (busca case-insensitive)
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - ATA
          - COMUNICADO
          - MEMORANDO
          - OFICIO
          - OUTRO
          - RELATORIO
        description: |-
          Tipo de comunicação formal

          * `ATA` - Ata de Reunião
          * `MEMORANDO` - Memorando
          * `RELATORIO` - Relatório
          * `OFICIO` - Ofício
          * `COMUNICADO` - Comunicado Geral
          * `OUTRO` - Outro
      - in: query
        name: titulo
        schema:
          type: string
        description: Texto contido no título da comunicação (busca case-insensitive)
      tags:
      - communications
      security:
      - JWT Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComunicacaoList'
          description: ''
    post:
      operationId: communications_create
      description: |-
        ViewSet para gerenciamento de comunicações formais.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Comunicações formais são documentos oficiais como atas, memorandos e relatórios.

        Endpoints:
        - GET /comunicacoes/ - Lista todas as comunicações (com filtros)
        - POST /comunicacoes/ - Cria uma nova comunicação
        - GET /comunicacoes/{id}/ - Obtém detalhes de uma comunicação
        - PUT/PATCH /comunicacoes/{id}/ - Atualiza uma comunicação
        - DELETE /comunicacoes/{id}/ - Remove uma comunicação
      tags:
      - communications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
        required: true
      security:
      - JWT Authentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunicacao'
          description: ''
  /api/communications/{id}/:
    get:
      operationId: communications_retrieve
      description: |-
        ViewSet para gerenciamento de comunicações formais.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Comunicações formais são documentos oficiais como atas, memorandos e relatórios.

        Endpoints:
        - GET /comunicacoes/ - Lista todas as comunicações (com filtros)
        - POST /comunicacoes/ - Cria uma nova comunicação
        - GET /comunicacoes/{id}/ - Obtém detalhes de uma comunicação
        - PUT/PATCH /comunicacoes/{id}/ - Atualiza uma comunicação
        - DELETE /comunicacoes/{id}/ - Remove uma comunicação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Comunicação.
        required: true
      tags:
      - communications
      security:
      - JWT Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunicacao'
          description: ''
    put:
      operationId: communications_update
      description: |-
        Sobrescreve o método de atualização para verificar permissões.

        Apenas o remetente original ou um administrador pode atualizar uma comunicação.

        Args:
            request: Objeto de requisição

        Returns:
            Response: Resposta da atualização ou erro de permissão
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Comunicação.
        required: true
      tags:
      - communications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComunicacaoRequest'
        required: true
      security:
      - JWT Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunicacao'
          description: ''
    patch:
      operationId: communications_partial_update
      description: |-
        ViewSet para gerenciamento de comunicações formais.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Comunicações formais são documentos oficiais como atas, memorandos e relatórios.

        Endpoints:
        - GET /comunicacoes/ - Lista todas as comunicações (com filtros)
        - POST /comunicacoes/ - Cria uma nova comunicação
        - GET /comunicacoes/{id}/ - Obtém detalhes de uma comunicação
        - PUT/PATCH /comunicacoes/{id}/ - Atualiza uma comunicação
        - DELETE /comunicacoes/{id}/ - Remove uma comunicação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Comunicação.
        required: true
      tags:
      - communications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComunicacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComunicacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComunicacaoRequest'
      security:
      - JWT Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunicacao'
          description: ''
    delete:
      operationId: communications_destroy
      description: |-
        ViewSet para gerenciamento de comunicações formais.

        Permite criar, listar, atualizar e excluir comunicações formais em projetos.
        Comunicações formais são documentos oficiais como atas, memorandos e relatórios.

        Endpoints:
        - GET /comunicacoes/ - Lista todas as comunicações (com filtros)
        - POST /comunicacoes/ - Cria uma nova comunicação
        - GET /comunicacoes/{id}/ - Obtém detalhes de uma comunicação
        - PUT/PATCH /comunicacoes/{id}/ - Atualiza uma comunicação
        - DELETE /comunicacoes/{id}/ - Remove uma comunicação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Comunicação.
        required: true
      tags:
      - communications
      security:
      - JWT Authentication: []
      responses:
        '204':
          description: No response body
  /api/communications/configuracoes/:
