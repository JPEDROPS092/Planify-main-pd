        * `ANALISTA` - Analista
    PatchedAlertaRequest:
      type: object
      description: |-
        Serializer para o modelo Alerta.

        Inclui todos os campos do modelo Alerta.
        Adiciona campos de leitura para exibir o valor textual dos campos de escolha
        ('tipo', 'status') e nomes relacionados (projeto, tarefa, resolvedor).
      properties:
        tipo:
          $ref: '#/components/schemas/AlertaTipoEnum'
        projeto:
          type: integer
        tarefa:
          type: integer
          nullable: true
        percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        mensagem:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/AlertaStatusEnum'
        resolvido_por:
          type: integer
          nullable: true
    PatchedAtribuicaoTarefaRequest:
      type: object
      properties:
        tarefa:
          type: integer
        usuario:
          type: integer
        atribuido_por:
          type: integer
          nullable: true
    PatchedCategoriaRequest:
      type: object
      description: |-
        Serializer para o modelo Categoria.

        Utilizado para serializar/desserializar dados da categoria.
        Inclui todos os campos do modelo.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        descricao:
          type: string
          nullable: true
    PatchedChatMensagemRequest:
      type: object
      properties:
        projeto:
          type: integer
          description: Projeto ao qual a mensagem pertence
        texto:
          type: string
          minLength: 1
          description: Conteúdo da mensagem
        anexo:
          type: string
          format: binary
          nullable: true
          description: Arquivo opcional anexado à mensagem
    PatchedComentarioRequest:
      type: object
      properties:
        documento:
          type: integer
        autor:
          type: integer
        texto:
          type: string
          minLength: 1
    PatchedComentarioTarefaRequest:
      type: object
      properties:
        tarefa:
          type: integer
        autor:
          type: integer
        texto:
          type: string
          minLength: 1
