          type: integer
          nullable: true
        categoria:
          type: integer
          nullable: true
        descricao:
          type: string
          minLength: 1
          maxLength: 200
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tipo:
          $ref: '#/components/schemas/CustoTipoEnum'
        data:
          type: string
          format: date
        comprovante:
          type: string
          format: binary
          nullable: true
        observacoes:
          type: string
          nullable: true
        criado_por:
          type: integer
          nullable: true
    PatchedDocumentoRequest:
      type: object
      properties:
        projeto:
          type: integer
        tarefa:
          type: integer
          nullable: true
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        descricao:
          type: string
          nullable: true
        tipo:
          $ref: '#/components/schemas/Tipo0e9Enum'
        arquivo:
          type: string
          format: binary
        versao:
          type: string
          minLength: 1
          maxLength: 20
        enviado_por:
          type: integer
          nullable: true
