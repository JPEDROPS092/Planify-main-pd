components:
  schemas:
    AccessProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - permissions
      - updated_at
    AccessProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - name
    ActionEnum:
      enum:
      - VIEW
      - CREATE
      - EDIT
      - DELETE
      - APPROVE
      - ASSIGN
      - EXPORT
      - IMPORT
      - COMMENT
      type: string
      description: |-
        * `VIEW` - View
        * `CREATE` - Create
        * `EDIT` - Edit
        * `DELETE` - Delete
        * `APPROVE` - Approve
        * `ASSIGN` - Assign
        * `EXPORT` - Export
        * `IMPORT` - Import
        * `COMMENT` - Comment
    Alerta:
      type: object
      description: |-
        Serializer para o modelo Alerta.

        Inclui todos os campos do modelo Alerta.
        Adiciona campos de leitura para exibir o valor textual dos campos de escolha
        ('tipo', 'status') e nomes relacionados (projeto, tarefa, resolvedor).
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          $ref: '#/components/schemas/AlertaTipoEnum'
        tipo_display:
          type: string
          readOnly: true
        projeto:
          type: integer
        projeto_nome:
          type: string
          readOnly: true
        tarefa:
          type: integer
          nullable: true
        tarefa_titulo:
          type: string
          readOnly: true
        percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        mensagem:
          type: string
        status:
          $ref: '#/components/schemas/AlertaStatusEnum'
        status_display:
