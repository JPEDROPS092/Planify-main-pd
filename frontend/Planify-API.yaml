openapi: 3.0.3
info:
  title: Planify API
  version: 1.0.0
  description: Sistema de Gerenciamento de Projetos
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: "\n    Realiza o login do usuário e retorna os tokens de acesso\
        \ e refresh.\n    \n    O token de acesso deve ser usado no header de todas\
        \ as requisições:\n    `Authorization: JWT <access_token>`\n    \n    Quando\
        \ o token de acesso expirar (após 1 hora), use o token de refresh para obter\
        \ um novo.\n    "
      summary: Login de usuário
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: Credenciais inválidas
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Realiza o logout do usuário invalidando o token atual.
      summary: Logout de usuário
      tags:
      - Autenticação
      security:
